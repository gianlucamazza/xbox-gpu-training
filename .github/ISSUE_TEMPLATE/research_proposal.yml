name: Research proposal
description: Hypothesis or experiment for the DirectX 12 / HLSL training backend.
title: "[research] "
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: |
        Model and protocol semantics are owned by FloppyLM (gianlucamazza/floppylm, ADR 0012); propose those changes there.
        Claims and non-claims: https://github.com/gianlucamazza/xbox-gpu-training/blob/main/docs/claims-policy.md
  - type: dropdown
    id: lane
    attributes:
      label: Area
      options:
        - E0 trainer (src/cpp/e0, e0_tensor.hlsl, uwp)
        - Diagnostic host (Fase 0–5)
        - Docs / evidence
        - CI / build
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic label
      options:
        - kernel
        - memory
        - benchmark
        - adr
        - research
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      placeholder: What will we measure? What would falsify it?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      placeholder: Kernel or engine change / fixtures and gates / evidence to commit / console time needed
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Results will follow the claims policy (sourced or explicitly unmeasured)
          required: true
        - label: An ADR will accompany any architecture or gate change
          required: true
