name: Bug
description: Something is broken (E0 trainer, UWP app, diagnostic host, CI, docs).
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Evidence-first: paste real logs; follow the claims policy (https://github.com/gianlucamazza/xbox-gpu-training/blob/main/docs/claims-policy.md).
        For console issues include the package full name and source commit from device.json.
  - type: dropdown
    id: lane
    attributes:
      label: Area
      options:
        - E0 trainer (src/cpp/e0, e0_tensor.hlsl, uwp)
        - Diagnostic host (Fase 0–5)
        - Docs / evidence
        - CI / build
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: E0 package + commit / Series S Dev Mode / windows-latest CI / Windows SDK version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual (paste logs)
    validations:
      required: true
  - type: checkboxes
    id: honesty
    attributes:
      label: Honesty
      options:
        - label: Every number above comes from a real run (claims policy)
          required: true
