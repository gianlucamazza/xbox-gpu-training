name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-docs:
    name: lint-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required docs
        run: python3 scripts/check_required_docs.py

      - name: Glossary claim check
        run: python3 scripts/check_glossary.py

      - name: Relative Markdown links and anchors
        run: python3 scripts/check_relative_links.py

      - name: Doc claims match evidence
        run: python3 scripts/check_doc_claims.py

      - name: Doc check unit tests
        run: python3 -m unittest discover -s scripts/tests

      - name: QAT/WSD schedule dry-run
        run: python3 scripts/validate_qat_schedule.py examples/qat-wsd-smoke.json --dry-run

  build-windows:
    name: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Cache NuGet packages (future C# / packages)
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '**/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache vcpkg binary cache (if used later)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
        continue-on-error: true

      # windows-latest (2025/2026 images) ships Visual Studio 2026, not 2022.
      # Do not pin -G "Visual Studio 17 2022"; CMake auto-detects the newest VS.
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -A x64
          $gen = Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_GENERATOR:INTERNAL=' |
            ForEach-Object { $_.Line.Split('=', 2)[1] }
          Write-Host "CMake generator: $gen"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**CMake generator:** $gen (auto-detected; not pinned to VS 2022)."

      - name: Build C++ host and hello_compute
        run: cmake --build build --config Release

      - name: Compile HLSL with dxc (skip if missing)
        shell: pwsh
        run: |
          $dxc = Get-Command dxc -ErrorAction SilentlyContinue
          if (-not $dxc) {
            $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            if (Test-Path $kits) {
              $found = Get-ChildItem -Path $kits -Recurse -Filter dxc.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\dxc.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($found) { $dxc = $found.FullName }
            }
          } else {
            $dxc = $dxc.Source
          }
          if (-not $dxc) {
            Write-Host "dxc not found on windows-latest — HLSL compile skipped (Windows SDK path missing)."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**HLSL:** ``dxc`` missing; compile skipped. Not a GPU result."
            exit 0
          }
          Write-Host "Using dxc: $dxc"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $dxc -T cs_6_0 -E CSMain -Fo build/hello_compute.cso src/hlsl/hello_compute.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/matmul.cso src/hlsl/matmul.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/rmsnorm.cso src/hlsl/rmsnorm.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/rope.cso src/hlsl/rope.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/flp2_decode.cso src/hlsl/flp2_decode.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/flp2_forward.cso src/hlsl/flp2_forward.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/fakequant_ternary.cso src/hlsl/fakequant_ternary.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/matmul_grad.cso src/hlsl/matmul_grad.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/relu2_grad.cso src/hlsl/relu2_grad.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dxc -T cs_6_0 -E CSMain -Fo build/ste_backward.cso src/hlsl/ste_backward.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($dir in @("build\Release", "build\src\cpp\Release", "dist\bin")) {
            if (Test-Path $dir) {
              Copy-Item -Force build/hello_compute.cso (Join-Path $dir "hello_compute.cso")
            }
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**HLSL:** compiled ``hello_compute.hlsl`` (Fase 0), ``matmul.hlsl`` (Fase 1), ``rmsnorm`` / ``rope`` / ``flp2_decode`` / ``flp2_forward`` (Fase 2), and ``fakequant_ternary`` / ``matmul_grad`` / ``relu2_grad`` / ``ste_backward`` (Fase 3) with dxc."

      - name: Run host (hello compute or BLOCKED)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --install build --config Release --prefix dist
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cmake --install returned $LASTEXITCODE; will search the build tree."
          }

          Write-Host "=== executables under build/ and dist/ ==="
          Get-ChildItem -Path build,dist -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

          $candidates = @(
            "dist\bin\xbox_gpu_host.exe",
            "build\src\cpp\Release\xbox_gpu_host.exe",
            "build\Release\xbox_gpu_host.exe",
            "build\xbox_gpu_host.exe",
            "build\src\cpp\xbox_gpu_host.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $found = Get-ChildItem -Path build,dist -Recurse -Filter xbox_gpu_host.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $exe = $found.FullName }
          }

          $hasDxgi = Test-Path "$env:SystemRoot\System32\dxgi.dll"
          if (-not $exe) {
            Write-Host "xbox_gpu_host.exe not found after building target xbox_gpu_host. DXGI present: $hasDxgi"
            if (-not $hasDxgi) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**C++ host:** skipped run — binary not found and DXGI missing on runner. Not a GPU result."
              exit 0
            }
            throw "xbox_gpu_host.exe not found after build (target xbox_gpu_host). Listed build/dist tree above."
          }

          Write-Host "Running $exe"
          & $exe *>&1 | Tee-Object -FilePath host-run.txt
          $code = $LASTEXITCODE
          $output = Get-Content host-run.txt -ErrorAction SilentlyContinue
          $text = ($output -join "`n")
          if ($text -match 'STATUS: hello_compute dispatched') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**C++ host:** ``$exe`` reported ``STATUS: hello_compute dispatched`` (Windows D3D12; WARP is software, not console)."
          } elseif ($text -match 'BLOCKED:') {
            $blocked = ($output | Where-Object { $_ -match 'BLOCKED:' } | Select-Object -First 1)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**C++ host:** ``$exe`` reported ``$blocked``. Not a GPU result. Dispatch log not invented."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**C++ host:** ran ``$exe`` (no STATUS/BLOCKED line). Not treated as a GPU success."
          }
          if ($code -ne 0) { exit $code }

          Write-Host "Running $exe --forward-fixture benchmarks/fixtures/tiny_flp2.json"
          & $exe --forward-fixture benchmarks/fixtures/tiny_flp2.json *>&1 | Tee-Object -FilePath host-flp2.txt
          $code = $LASTEXITCODE
          $flp2 = Get-Content host-flp2.txt -ErrorAction SilentlyContinue
          $flp2text = ($flp2 -join "`n")
          if ($flp2text -match 'STATUS: flp2 forward dispatched') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**FLP2:** GPU forward dispatched vs CPU fixture. Not a tok/s result. Not a console result."
          } elseif ($flp2text -match 'STATUS: flp2 cpu-ref ok' -or $flp2text -match 'BLOCKED:') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**FLP2:** CPU fixture matched; GPU path ``BLOCKED`` or not dispatched. Dispatch log not invented."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**FLP2:** ``--forward-fixture`` ran (see log). Not treated as a GPU success."
          }
          if ($code -ne 0) { exit $code }

          Write-Host "Running $exe --grad-check"
          & $exe --grad-check *>&1 | Tee-Object -FilePath host-grad.txt
          $code = $LASTEXITCODE
          $grad = Get-Content host-grad.txt -ErrorAction SilentlyContinue
          $gradtext = ($grad -join "`n")
          if ($gradtext -match 'STATUS: grad-check dispatched') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 3:** GPU grad kernels dispatched vs CPU. Not a tok/s result. Not a quality curve."
          } elseif ($gradtext -match 'STATUS: grad-check ok' -or $gradtext -match 'BLOCKED:') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 3:** CPU grad-check passed; GPU path ``BLOCKED`` or not dispatched. Dispatch log not invented."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 3:** ``--grad-check`` ran (see log). Not treated as a GPU success."
          }
          if ($code -ne 0) { exit $code }

          Write-Host "Running $exe --train-step 1"
          & $exe --train-step 1 *>&1 | Tee-Object -FilePath host-train.txt
          $code = $LASTEXITCODE
          $tr = Get-Content host-train.txt -ErrorAction SilentlyContinue
          $trtext = ($tr -join "`n")
          if ($trtext -match 'STATUS: train-step dispatched') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 3:** one AdamW/STE step with GPU kernel compare. DirectML is not the optimizer."
          } elseif ($trtext -match 'STATUS: train-step ok' -or $trtext -match 'BLOCKED:') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 3:** one CPU AdamW/STE step; GPU path ``BLOCKED`` or not dispatched. Dispatch log not invented."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 3:** ``--train-step 1`` ran (see log). Not treated as a GPU success."
          }
          if ($code -ne 0) { exit $code }

          Write-Host "Running $exe --stream-stress --budget-mb 1024"
          & $exe --stream-stress --budget-mb 1024 *>&1 | Tee-Object -FilePath host-stream.txt
          $code = $LASTEXITCODE
          $st = Get-Content host-stream.txt -ErrorAction SilentlyContinue
          $sttext = ($st -join "`n")
          if ($sttext -match 'STATUS: stream-stress dispatched') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 4:** host stream + GPU double-buffer copies. Desktop/CI working-set only. Console AppContainer **UNVALIDATED**. Not a tok/s result."
          } elseif ($sttext -match 'STATUS: stream-stress budget breach') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 4:** stream finished; **measured** peak working-set exceeded ``--budget-mb 1024``. Console AppContainer **UNVALIDATED**."
          } elseif ($sttext -match 'STATUS: stream-stress ok' -or $sttext -match 'BLOCKED:') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 4:** host double-buffer stream ran; GPU path ``BLOCKED`` or not dispatched. Console AppContainer **UNVALIDATED**. Dispatch log not invented."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 4:** ``--stream-stress`` ran (see log). Not treated as a console success."
          }
          if ($code -ne 0) { exit $code }

          Write-Host "Running $exe --qat-smoke --steps 16"
          & $exe --qat-smoke --steps 16 *>&1 | Tee-Object -FilePath host-qat.txt
          $code = $LASTEXITCODE
          $qat = Get-Content host-qat.txt -ErrorAction SilentlyContinue
          $qattext = ($qat -join "`n")
          if ($qattext -match 'STATUS: qat-smoke ok') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 5:** host QAT/WSD smoke completed N=16 (``examples/qat-wsd-smoke.json``). Not a quality curve. Not a tok/s result. No new HLSL."
          } elseif ($qattext -match 'STATUS: qat-schedule dry-run ok' -or $qattext -match 'BLOCKED:') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 5:** schedule validated; GPU path ``BLOCKED`` or host-only. Dispatch log not invented."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Fase 5:** ``--qat-smoke --steps 16`` ran (see log). Not treated as a quality result."
          }
          if ($code -ne 0) { exit $code }

          $helloCandidates = @(
            "dist\bin\hello_compute.exe",
            "build\examples\hello-compute\Release\hello_compute.exe",
            "build\Release\hello_compute.exe",
            "build\hello_compute.exe"
          )
          $hello = $helloCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($hello) {
            Write-Host "Running $hello"
            & $hello
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "hello_compute.exe not found; xbox_gpu_host already exercised the dispatch path."
          }

      # Windows SDK itself is not fully cacheable; NuGet/vcpkg caches above are for later phases.

  notify-failure:
    name: notify-failure
    if: failure()
    needs: [lint-docs, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Job summary
        run: |
          {
            echo "## CI failed"
            echo "Check **lint-docs** and **build-windows**. GitHub native failure is the notification (no external webhooks)."
          } >> "$GITHUB_STEP_SUMMARY"
