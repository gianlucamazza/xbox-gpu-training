name: E0 UWP
on:
  workflow_dispatch:
  push:
    branches: [phase-5/e0-backend-contract]
  pull_request:
    paths: ['src/cpp/e0/**', 'src/hlsl/e0_tensor.hlsl', 'uwp/**', 'scripts/build-e0-uwp.ps1', '.github/workflows/e0-uwp.yml']
permissions:
  contents: read
jobs:
  uwp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: NuGet/setup-nuget@v2
      - name: Build unsigned Release package
        shell: pwsh
        run: ./scripts/build-e0-uwp.ps1
      - name: Upload package and layout
        uses: actions/upload-artifact@v7
        with:
          name: e0-uwp-${{ github.sha }}
          path: |
            uwp/AppPackages/**
            build/uwp/AppX/**
          if-no-files-found: error
