name: E0 UWP
on:
  workflow_dispatch:
  push:
    branches: [phase-5/e0-backend-contract]
  pull_request:
    paths: ['src/cpp/e0/**', 'src/cpp/dx12_device.cpp', 'src/hlsl/e0_tensor.hlsl', 'uwp/**', 'scripts/build-e0-uwp.ps1', '.github/workflows/e0-uwp.yml']
permissions:
  contents: read
jobs:
  uwp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
      - name: Build unsigned Release package
        shell: pwsh
        run: ./scripts/build-e0-uwp.ps1
      - name: Upload package and layout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e0-uwp-${{ github.sha }}
          path: |
            uwp/AppPackages/**
            build/uwp/AppX/**
          if-no-files-found: error
